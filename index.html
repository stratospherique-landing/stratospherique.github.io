<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stratosphérique // where clarity takes off</title>

<style>
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --accent: #00aaff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", "Fira Code", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px;
  }

  .shell {
    max-width: 780px;
    width: 100%;
    font-size: 1rem;
    letter-spacing: 0.03em;
    text-transform: lowercase;
    line-height: 1.5;
  }

  .title {
    font-size: 1.4rem;
    margin-bottom: 16px;
    cursor: pointer;
  }

  .section { margin-top: 32px; }
  .accent { color: var(--accent); font-weight: bold; }

  .separator {
    margin: 32px 0;
    border-bottom: 1px dashed #ddd;
  }

  a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--fg);
  }

  a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /
