<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stratosphérique // mission clarity</title>

<style>
  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --accent: #0066ff;      /* bleu NASA */
    --grid: #d0d0d0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", "Fira Code", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px;
  }

  .shell {
    max-width: 920px;
    width: 100%;
    letter-spacing: 0.02em;
    text-transform: lowercase;
    line-height: 1.55;
  }

  .title {
    font-size: 1.4rem;
    margin-bottom: 12px;
    cursor: pointer;
  }

  .accent { color: var(--accent); font-weight: bold; }

  .separator {
    margin: 32px 0;
    border-bottom: 1px solid var(--grid);
  }

  /* --- GRID NASA STYLE ---- */
  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
    margin-top: 28px;
  }

  .block {
    border: 1px solid var(--grid);
    padding: 20px;
    border-radius: 6px;
    background: #fafafa;
    min-height: 240px;
  }

  .block-title {
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--accent);
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  a {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px solid var(--fg);
  }

  a:hover {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ---- EASTER EGG ---- */
  #easter-egg {
    display: none;
    white-space: pre;
    background: #000;
    color: #00ffea;
    padding: 20px;
    margin-top: 24px;
    border-radius: 8px;
    font-size: 0.9rem;
    line-height: 1.4;
    border: 1px solid #00ffea;
  }
</style>
</head>

<body>
<div class="shell">

  <!-- HEADER / EASTER EGG TRIGGER -->
  <div class="title" id="trigger-ee">
    stratosphérique // <span class="accent">mission clarity</span>
  </div>

  <div id="easter-egg">
system boot // ascension protocol  
clarity altitude +400m  
signal: stable  
trajectory: locked
