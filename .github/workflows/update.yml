name: Update feeds

on:
  schedule:
    - cron: "11 5 * * *"   # 05:11 UTC = 07:11 Paris (été). Hors heure ronde = moins de runs sautées.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false   # deux runs ne se télescopent plus

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install rss-parser
      - run: node scripts/fetch-feeds.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feeds.json
          git diff --staged --quiet && echo "Rien à committer" && exit 0
          git commit -m "Update feeds [skip ci]"
          git pull --rebase --autostash origin main
          git push
