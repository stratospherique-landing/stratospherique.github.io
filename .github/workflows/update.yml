name: Update feeds
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install rss-parser
      - run: node scripts/fetch-feeds.mjs
      - name: Commit
        run: |
          git config user.name "observatoire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feeds.json
          if git diff --staged --quiet; then
            echo "Rien a committer."
          else
            git commit -m "data: maj automatique [skip ci]"
            git push
          fi
